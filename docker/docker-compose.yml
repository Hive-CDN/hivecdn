version: '3.9'

services:
  edge-node:
    build:
      context: ..
      dockerfile: docker/Dockerfile.edge
    ports:
      - "8080:8080"
    environment:
      - HIVECDN_API_KEY=${HIVECDN_API_KEY}
      - HIVECDN_ZONE_ID=${HIVECDN_ZONE_ID}
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
